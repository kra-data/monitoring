server:
  http_listen_port: 9080

clients:
  - url: http://192.168.64.1:3100/loki/api/v1/push # ← 너의 로컬 PC IP
    # batchsize, timeout 등 기본값으로도 충분

positions:
  filename: /tmp/promtail-positions.yaml

scrape_configs:
  # 1) Docker 컨테이너 로그 (Spring, Node 등)
  - job_name: docker-logs
    pipeline_stages:
      - docker: {} # 도커 JSON 로그에서 기본 필드 추출
      - json:
          expressions:
            level: level
            logger: logger
            method: method
            path: path
            status: status
            uri: uri
      - labels:
          level:
          logger:
          method:
          path:
          status:
          uri:
    static_configs:
      - targets: [localhost]
        labels:
          job: spring-app # ← 대시보드/Explore에서 이 라벨로 필터
          __path__: /var/lib/docker/containers/*/*-json.log

  # 2) Caddy 액세스 로그(JSON) — 선택: Caddy를 도커가 아닌 호스트에서 실행중일 때
  - job_name: caddy-access
    pipeline_stages:
      - json:
          expressions:
            ts: time
            status: status
            method: method
            uri: request>uri
            upstream: resp_headers>X-Upstream
      - labels:
          status:
          method:
          upstream:
      - timestamp:
          source: ts
          format: RFC3339
    static_configs:
      - targets: [localhost]
        labels:
          job: caddy
          __path__: /var/log/caddy/*.log
