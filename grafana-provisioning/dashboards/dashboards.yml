apiVersion: 1

providers:
  - name: 'MyDreamDay dashboards'
    orgId: 1
    folder: 'MyDreamDay'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: true
